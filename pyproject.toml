[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "order-number-lens"
version = "0.1.0"
description = "Local batch OCR review queue for long order numbers in images"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["rapidocr>=3.9,<4", "onnxruntime>=1.20,<2", "Pillow>=11,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
order-number-lens = "order_number_lens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/order_number_lens"]

[tool.pytest.ini_options]
pythonpath = ["src"]
